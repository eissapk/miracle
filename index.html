<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/olum-ui.min.css" />
    <link rel="stylesheet" href="css/font.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div id="loader">
      <div class="indicator"></div>
    </div>

    <div class="o-grid" style="grid-gap: 10px">
      <!-- next/prev -->
      <div class="o-grid col=1:2 row=1:2" style="grid-gap: 25px; margin: 25px">
        <button id="next" class="o-btn col=1:2">الصفحة التالية</button>
        <button id="prev" class="o-btn col=2:3">الصفحة السابقة</button>
      </div>
      <!-- search -->
      <div class="col=1:2 row=2:3" style="justify-self: center">
        <div class="o-search">
          <input id="engine" class="o-input" type="text" required placeholder="ابحث عن أية" />
          <button class="o-close" id="engine-clear"></button>
        </div>
      </div>
      <!-- pages -->
      <main class="col=1:2 row=3:4"></main>
    </div>

    <script defer src="js/olum-ui.min.js"></script>
    <script defer src="js/index.js"></script>
    <script defer src="js/app.js"></script>
  </body>
</html>
