<!DOCTYPE html>
<html lang="en" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/olum-ui.min.css" />
    <link rel="stylesheet" href="css/font.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <div id="loader">
      <div class="indicator"></div>
    </div>
    
    <div class="featuresBox">
      <button class="o-btn" id="saveVerse">احفظ الاية</button>
      <button class="o-btn">احفظ الصفحة</button>
      <button class="o-btn">تفسير</button>
      <button class="o-btn">قراءة</button>
    </div>

    <div class="o-grid" style="grid-gap: 10px">
      <!-- next/prev -->
      <div class="o-grid col=1:2 row=1:2" style="grid-gap: 25px; margin: 25px">
        <button id="next" class="o-btn col=1:2">الصفحة التالية</button>
        <button id="prev" class="o-btn col=2:3">الصفحة السابقة</button>
      </div>
      <!-- search -->
      <div class="col=1:2 row=2:3" style="justify-self: center">
        <div class="o-search">
          <input id="engine" class="o-input" type="text" required placeholder="ابحث عن أية" />
          <button class="o-close" id="engine-clear"></button>
        </div>
      </div>

      <!-- go to page number -->
      <div class="col=1:2 row=3:4" style="justify-self: center">
        <input id="gotoPageNum" style="min-width: 100px" type="number" placeholder="اذهب الى صفحة" class="o-input" min="1" max="604" />
      </div>

      <!-- go to part number -->
      <div class="col=1:2 row=4:5" style="justify-self: center">
        <input id="gotoPartNum" style="min-width: 100px" type="number" placeholder="اذهب الى جزء" class="o-input" min="1" max="30" />
      </div>

      <!-- table of contents -->
      <div class="col=1:2 row=5:6" style="justify-self: center">
        <button type="button" class="o-btn" id="tocBtn">الفهرس</button>
      </div>

      <!-- pages -->
      <main class="col=1:2 row=6:7"></main>
    </div>

    <script defer src="js/olum-ui.min.js"></script>
    <script defer src="js/global.js"></script>
    <script defer src="js/init.js"></script>
    <script defer src="js/search.js"></script>
    <script defer src="js/go.js"></script>
    <script defer src="js/bookmark.js"></script>
  </body>
</html>
